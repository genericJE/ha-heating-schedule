<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Heating Schedule logo: a radiator with rising heat waves, above a slider with two handles">
  <!-- Heat waves rising off the top of the radiator -->
  <g fill="none" stroke="#FF9800" stroke-width="7" stroke-linecap="round">
    <!-- bottom wave: widest, closest to the radiator -->
    <path d="M76 56 q12 -14 24 0 t24 0 t24 0 t24 0"/>
    <!-- middle wave -->
    <path d="M92 32 q10 -12 20 0 t20 0 t20 0"/>
    <!-- top wave: smallest, highest -->
    <path d="M108 12 q8 -10 16 0 t16 0"/>
  </g>

  <!-- Radiator: literal mdi:radiator path scaled 4x and centred -->
  <g transform="translate(80 76) scale(4)" fill="#FF9800">
    <path d="M7,7H17V9H19V11H21V13H19V15H17V17H15V11H13V13H11V11H9V13H7V15H5V13H3V11H5V9H7V7M5,17H7V19H5V17M9,19H11V21H9V19M13,17H15V19H13V17M17,19H19V21H17V19Z"/>
  </g>

  <!-- Slider track + active-window fill -->
  <rect x="32" y="216" width="192" height="8" rx="4" fill="#D8D8D8"/>
  <rect x="74" y="216" width="108" height="8" rx="4" fill="#FF9800"/>

  <!-- Two handles, matching the card's white-fill + orange-ring + orange-dot style -->
  <g>
    <circle cx="74"  cy="220" r="14" fill="#FFFFFF" stroke="#FF9800" stroke-width="4"/>
    <circle cx="74"  cy="220" r="6"  fill="#FF9800"/>
    <circle cx="182" cy="220" r="14" fill="#FFFFFF" stroke="#FF9800" stroke-width="4"/>
    <circle cx="182" cy="220" r="6"  fill="#FF9800"/>
  </g>
</svg>
