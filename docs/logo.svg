<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Heating Schedule logo: a radiator with three rising heat squiggles, above a slider with two handles">
  <!-- Heat waves: 3 identical vertical squiggles, evenly spaced across the radiator's width -->
  <g fill="none" stroke="#FF9800" stroke-width="6" stroke-linecap="round">
    <!-- Each path is a 36-tall vertical sine: starts at the top-of-radiator line, rises up.
         The control offsets alternate so each segment curves opposite the previous one. -->
    <path d="M84  64 q -10,-6 0,-12 t 0,-12 t 0,-12"/>
    <path d="M128 64 q -10,-6 0,-12 t 0,-12 t 0,-12"/>
    <path d="M172 64 q -10,-6 0,-12 t 0,-12 t 0,-12"/>
  </g>

  <!-- Radiator: clean stylized 4-fin design with top + bottom caps, plus 4 drop dots below -->
  <g fill="#FF9800">
    <!-- Top cap -->
    <rect x="32" y="76" width="192" height="14" rx="6"/>
    <!-- Bottom cap -->
    <rect x="32" y="166" width="192" height="14" rx="6"/>
    <!-- 4 vertical fins (rounded, slightly overlapping caps for a joined silhouette) -->
    <rect x="56"  y="82" width="22" height="92" rx="9"/>
    <rect x="98"  y="82" width="22" height="92" rx="9"/>
    <rect x="138" y="82" width="22" height="92" rx="9"/>
    <rect x="178" y="82" width="22" height="92" rx="9"/>
    <!-- 4 drop dots below, evenly spaced and matching the fins' x-centres -->
    <circle cx="67"  cy="194" r="5"/>
    <circle cx="109" cy="194" r="5"/>
    <circle cx="149" cy="194" r="5"/>
    <circle cx="189" cy="194" r="5"/>
  </g>

  <!-- Slider track + active-window fill -->
  <rect x="32" y="220" width="192" height="8" rx="4" fill="#D8D8D8"/>
  <rect x="74" y="220" width="108" height="8" rx="4" fill="#FF9800"/>

  <!-- Two handles, white fill + orange ring + orange centre dot -->
  <g>
    <circle cx="74"  cy="224" r="14" fill="#FFFFFF" stroke="#FF9800" stroke-width="4"/>
    <circle cx="74"  cy="224" r="6"  fill="#FF9800"/>
    <circle cx="182" cy="224" r="14" fill="#FFFFFF" stroke="#FF9800" stroke-width="4"/>
    <circle cx="182" cy="224" r="6"  fill="#FF9800"/>
  </g>
</svg>
