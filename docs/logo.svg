<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Heating Schedule logo: a radiator with rising heat squiggles, above a slider with two handles">
  <!-- Heat waves: three identical vertical squiggles evenly spaced above the radiator -->
  <g fill="none" stroke="#FF9800" stroke-width="6" stroke-linecap="round">
    <path d="M84  64 q -10,-6 0,-12 t 0,-12 t 0,-12"/>
    <path d="M128 64 q -10,-6 0,-12 t 0,-12 t 0,-12"/>
    <path d="M172 64 q -10,-6 0,-12 t 0,-12 t 0,-12"/>
  </g>

  <!-- Radiator: solid rounded-top body with four pill-shaped fin cutouts, plus two stubby legs -->
  <defs>
    <mask id="finCutouts" maskUnits="userSpaceOnUse">
      <!-- white = body visible, black = cut out (showing background through) -->
      <rect x="0" y="0" width="256" height="256" fill="white"/>
      <rect x="62"  y="92" width="20" height="80" rx="10" fill="black"/>
      <rect x="100" y="92" width="20" height="80" rx="10" fill="black"/>
      <rect x="138" y="92" width="20" height="80" rx="10" fill="black"/>
      <rect x="176" y="92" width="20" height="80" rx="10" fill="black"/>
    </mask>
  </defs>

  <g fill="#FF9800">
    <!-- Body: rounded-top rectangle, flat sides + bottom; rx applies to top corners only because we draw it as a path -->
    <path d="M 32 94 Q 32 70 56 70 L 200 70 Q 224 70 224 94 L 224 188 L 32 188 Z" mask="url(#finCutouts)"/>
    <!-- Two stubby legs hanging below, aligned with the body's outer edges -->
    <rect x="32"  y="188" width="24" height="20"/>
    <rect x="200" y="188" width="24" height="20"/>
  </g>

  <!-- Slider track + active-window fill -->
  <rect x="32" y="222" width="192" height="8" rx="4" fill="#D8D8D8"/>
  <rect x="74" y="222" width="108" height="8" rx="4" fill="#FF9800"/>

  <!-- Two handles, white fill + orange ring + orange centre dot -->
  <g>
    <circle cx="74"  cy="226" r="14" fill="#FFFFFF" stroke="#FF9800" stroke-width="4"/>
    <circle cx="74"  cy="226" r="6"  fill="#FF9800"/>
    <circle cx="182" cy="226" r="14" fill="#FFFFFF" stroke="#FF9800" stroke-width="4"/>
    <circle cx="182" cy="226" r="6"  fill="#FF9800"/>
  </g>
</svg>
