[project]
name = "ha-heating-schedule"
version = "0.1.0"
description = "Per-room heating schedule integration and card for Home Assistant"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14.2,<3.15"
dependencies = [
    "homeassistant>=2024.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["custom_components/heating_schedule"]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "ruff>=0.11",
    "pytest-homeassistant-custom-component>=0.13.367",
]

[tool.ruff]
line-length = 100
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "D",
    "ISC001",
    "FBT",
    "ANN401",
    "ARG",
    "PLR0913",
    "PLR2004",
    "TRY003",
    "EM",
    "TC",
    "PLC0415",
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
# pytest asserts are the test idiom; S101 only makes sense for shipped code.
"tests/*" = ["S101"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.14"
include = ["custom_components"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
