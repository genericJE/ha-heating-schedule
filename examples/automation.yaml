- id: '1779950000000'
  alias: Apply heating schedule per room
  description: 'Per-room heating schedule. For each room, reads its window list from
    input_text.heating_windows_<room> (JSON: [["HH:MM","HH:MM"], ...]). When the current
    time is inside any window, climate.<room>_heating target is set to input_number.heating_comfort_<room>;
    otherwise it drops to 14°C (Frostschutz). The last window in the list may wrap
    midnight (end < start). heating_paused overrides — Apply Heating Pause already
    drives all rooms to 14°C during a pause, so this automation no-ops. Triggers:
    every minute (time_pattern) as the safety net for arbitrary window edges; state
    changes on the per-room input_text + input_number.heating_comfort_* (instant re-eval
    on slider drag or spinner click); heating_paused off-transition (5 s delay so
    Resume Heating''s scene restore lands first); homeassistant.start. Idempotent
    write guard skips no-op set_temperature calls.'
  triggers:
  - trigger: time_pattern
    minutes: /1
    id: tick
  - trigger: state
    entity_id:
    - input_text.heating_windows_kitchen
    - input_number.heating_comfort_kitchen
    id: kitchen
  - trigger: state
    entity_id:
    - input_text.heating_windows_bedroom
    - input_number.heating_comfort_bedroom
    id: bedroom
  - trigger: state
    entity_id:
    - input_text.heating_windows_bathroom
    - input_number.heating_comfort_bathroom
    id: bathroom
  - trigger: state
    entity_id:
    - input_text.heating_windows_living_room
    - input_number.heating_comfort_living_room
    id: living_room
  - trigger: state
    entity_id: input_boolean.heating_paused
    from: 'on'
    to: 'off'
    id: all
  - trigger: homeassistant
    event: start
    id: all
  conditions: []
  actions:
  - variables:
      setback: 14
      rooms:
      - kitchen
      - bedroom
      - bathroom
      - living_room
  # 5 s settle when the trigger is heating_paused off→on or HA start (trigger.id
  # == 'all') — lets Resume Heating's scene.turn_on + Hc1DayTemp fallback land
  # before we re-assert. Per-room state triggers and the periodic tick bypass.
  - if:
    - condition: template
      value_template: "{{ (trigger.id | default('')) == 'all' }}"
    then:
    - delay:
        seconds: 5
  - repeat:
      for_each: '{{ rooms }}'
      sequence:
      - variables:
          room: '{{ repeat.item }}'
          paused: '{{ is_state("input_boolean.heating_paused", "on") }}'
          comfort: '{{ states("input_number.heating_comfort_" ~ room) | float(20)
            }}'
          n: '{% set p = now().strftime("%H:%M").split(":") %}{{ p[0] | int * 60
            + p[1] | int }}'
          in_window: "{% set raw = states('input_text.heating_windows_' ~ room) %}{%
            set windows = (raw | from_json) if (raw not in ['unavailable','unknown','',
            'None']) else [] %}{% set ns = namespace(hit=false) %}{% set nn = n |
            int %}{% for w in windows %}{% set sp = w[0].split(':') %}{% set ep =
            w[1].split(':') %}{% set s = sp[0] | int * 60 + sp[1] | int %}{% set
            e = ep[0] | int * 60 + ep[1] | int %}{% if (s < e and s <= nn < e) or
            (s > e and (nn >= s or nn < e)) %}{% set ns.hit = true %}{% endif %}{%
            endfor %}{{ ns.hit }}"
          desired: '{{ (comfort if in_window | bool else setback) | float }}'
          target_entity: 'climate.{{ room }}_heating'
          current_target: '{{ state_attr(target_entity, "temperature") }}'
          climate_state: '{{ states(target_entity) }}'
      - if:
        - condition: template
          value_template: '{{ not paused and climate_state not in ("unavailable","unknown","none")
            and current_target is not none and (current_target | float(0)) != desired
            }}'
        then:
        - action: climate.set_temperature
          target:
            entity_id: '{{ target_entity }}'
          data:
            temperature: '{{ desired }}'
  mode: queued
  max: 8
