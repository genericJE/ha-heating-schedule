# Helpers for the heating schedule. Append the contents of each top-level key
# to the matching key in your configuration.yaml (or include this file via
# !include if you keep helpers in a separate file).
#
# After editing, reload them without a full HA restart:
#   - service: input_datetime.reload
#   - service: input_number.reload

input_datetime:
  heating_window_kitchen_start:
    name: Kitchen heating start
    has_date: false
    has_time: true
    initial: '07:00'
    icon: mdi:weather-sunset-up
  heating_window_kitchen_end:
    name: Kitchen heating end
    has_date: false
    has_time: true
    initial: '22:00'
    icon: mdi:weather-sunset-down
  heating_window_bedroom_start:
    name: Bedroom heating start
    has_date: false
    has_time: true
    initial: '22:00'
    icon: mdi:weather-sunset-up
  heating_window_bedroom_end:
    name: Bedroom heating end
    has_date: false
    has_time: true
    initial: '07:00'
    icon: mdi:weather-sunset-down
  heating_window_bathroom_start:
    name: Bathroom heating start
    has_date: false
    has_time: true
    initial: '07:00'
    icon: mdi:weather-sunset-up
  heating_window_bathroom_end:
    name: Bathroom heating end
    has_date: false
    has_time: true
    initial: '22:00'
    icon: mdi:weather-sunset-down
  heating_window_living_room_start:
    name: Living Room heating start
    has_date: false
    has_time: true
    initial: '07:00'
    icon: mdi:weather-sunset-up
  heating_window_living_room_end:
    name: Living Room heating end
    has_date: false
    has_time: true
    initial: '23:00'
    icon: mdi:weather-sunset-down

input_number:
  heating_comfort_kitchen:
    name: Kitchen comfort temperature
    min: 5
    max: 30
    step: 0.5
    unit_of_measurement: '°C'
    icon: mdi:thermometer
    initial: 20
  heating_comfort_bedroom:
    name: Bedroom comfort temperature
    min: 5
    max: 30
    step: 0.5
    unit_of_measurement: '°C'
    icon: mdi:thermometer
    initial: 21
  heating_comfort_bathroom:
    name: Bathroom comfort temperature
    min: 5
    max: 30
    step: 0.5
    unit_of_measurement: '°C'
    icon: mdi:thermometer
    initial: 20
  heating_comfort_living_room:
    name: Living Room comfort temperature
    min: 5
    max: 30
    step: 0.5
    unit_of_measurement: '°C'
    icon: mdi:thermometer
    initial: 20
