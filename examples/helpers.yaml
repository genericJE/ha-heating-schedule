# Helpers for the heating schedule. Append the contents of each top-level key
# to the matching key in your configuration.yaml (or include this file via
# !include if you keep helpers in a separate file).
#
# After editing, reload them without a full HA restart:
#   - service: input_text.reload
#   - service: input_number.reload

input_text:
  # Per-room heating schedule. Each entity holds a JSON array of windows where
  # each window is ["HH:MM","HH:MM"]. 1-4 windows allowed. The card and the
  # Apply heating schedule automation read/write this. The last window in the
  # list may wrap midnight (end < start).
  heating_windows_kitchen:
    name: Kitchen heating windows
    initial: '[["07:00","22:00"]]'
    max: 255
  heating_windows_bedroom:
    name: Bedroom heating windows
    initial: '[["22:00","07:00"]]'
    max: 255
  heating_windows_bathroom:
    name: Bathroom heating windows
    initial: '[["07:00","22:00"]]'
    max: 255
  heating_windows_living_room:
    name: Living Room heating windows
    initial: '[["07:00","23:00"]]'
    max: 255

input_number:
  # Per-room comfort temperature. The window slider card's +/− spinner writes
  # these; the Apply heating schedule automation pushes the value to
  # climate.<room>_heating while at least one window is active, and drops to
  # the configured setback (number.heating_schedule_setback, fallback 14 °C)
  # otherwise.
  heating_comfort_kitchen:
    name: Kitchen comfort temperature
    min: 5
    max: 30
    step: 0.5
    unit_of_measurement: '°C'
    icon: mdi:thermometer
    initial: 20
  heating_comfort_bedroom:
    name: Bedroom comfort temperature
    min: 5
    max: 30
    step: 0.5
    unit_of_measurement: '°C'
    icon: mdi:thermometer
    initial: 21
  heating_comfort_bathroom:
    name: Bathroom comfort temperature
    min: 5
    max: 30
    step: 0.5
    unit_of_measurement: '°C'
    icon: mdi:thermometer
    initial: 20
  heating_comfort_living_room:
    name: Living Room comfort temperature
    min: 5
    max: 30
    step: 0.5
    unit_of_measurement: '°C'
    icon: mdi:thermometer
    initial: 20
